[package]
name = "homebrew-manager"
version = "0.8.0"
description = "Desktop manager for 5e homebrew, repo locking, overrides pipeline, and local site server"
authors = ["grapitygrape"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hm-core = { path = "../crates/hm-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "sync", "time", "rt-multi-thread", "macros"] }
rfd = "0.15"
open = "5"
url = "2"
