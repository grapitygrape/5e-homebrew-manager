name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check, tests & SvelteKit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check injected script bundles
        run: npm run scripts:bundle -- --check

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Export customizer patch-deploy seed
        run: node --experimental-strip-types --no-warnings=ExperimentalWarning customizer/shell/export.mjs --from-patch --no-licensed-fonts

      - name: Production web build (adapter-node)
        run: npm run build

  rust:
    name: Rust backend tests (hm-core & hm-backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git identity for unit tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Rust unit tests
        run: cargo test -p hm-core -p hm-backend --locked
