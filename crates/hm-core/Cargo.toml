[package]
name = "hm-core"
version = "0.8.0"
description = "Tauri-free core library for Homebrew Manager (shared by desktop/portable Tauri shell and headless container backend)"
authors = ["grapitygrape"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "sync", "time", "rt-multi-thread", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header", "compression-gzip", "compression-br"] }
regex = "1"
futures-core = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
