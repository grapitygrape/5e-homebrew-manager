[package]
name = "hm-backend"
version = "0.8.0"
description = "Headless Rust backend for Homebrew Manager (RPC/SSE, Foundry bridge, preview, and live site server)"
authors = ["grapitygrape"]
edition = "2021"

[dependencies]
hm-core = { path = "../hm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "sync", "time", "rt-multi-thread", "macros", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header", "compression-gzip", "compression-br"] }
futures-core = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
